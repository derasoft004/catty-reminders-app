name: CI Pipeline

on:
  push:
    branches: [ github-actions, docker-lab ]
  pull_request:
    branches: [ github-actions, docker-lab ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/my_unit_test.py -v
        

      
      - name: login 
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name:  push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/catty-app:latest
            ghcr.io/${{ github.repository_owner }}/catty-app:${{ github.sha }}
            
