name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1  # ← ПРАВИЛЬНЫЙ ACTION!
        with:
          host: course.prafdin.ru
          port: 2200
          username: kali
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u derasoft004 --password-stdin
            
            sudo fuser -k 8181/tcp 2>/dev/null || true
            docker stop $(docker ps -q) 2>/dev/null || true
            docker rm $(docker ps -aq) 2>/dev/null || true
            
            docker pull ghcr.io/derasoft004/catty-app-test:latest
            docker run -d -p 8181:8181 --name catty-production ghcr.io/derasoft004/catty-app-test:latest
            
            
